name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '23.10.0'          
      - name: Run demo with Docker images
        run: nextflow -C nextflow-test.config run main.nf -profile docker